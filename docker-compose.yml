services:
  frontend:
    container_name: frontend-workshop
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      WATCHPACK_POLLING: "true"

  backend:
    container_name: backend-workshop
    build: ./backend
    ports:
      - "8000:8000"
      - "16000:16000"
    volumes:
      - ./backend:/app
      - ./backend/node_modules:/app/node_modules
    depends_on:
      - mongo

  mongo:
    container_name: mongodb-workshop
    image: mongo:8.0.4
    ports:
      - "27017:27017"
    volumes:
      - ./backend/config/mongodb:/docker-entrypoint-initdb.d
      - mongo_data:/data/db

volumes:
  mongo_data: